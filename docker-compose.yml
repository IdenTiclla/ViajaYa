services:
  db:
    image: postgres:16-alpine
    container_name: viajaya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: viajaya
      POSTGRES_PASSWORD: viajaya
      POSTGRES_DB: viajaya
    ports:
      - "5432:5432"
    volumes:
      - viajaya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viajaya"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: viajaya_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_restart_test:
    image: redis:7.4-alpine
    container_name: viajaya_redis_restart_test
    profiles: ["restart-smoke"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 20

volumes:
  viajaya_pgdata:

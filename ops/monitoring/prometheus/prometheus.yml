global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/viajaya-realtime.rules.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: viajaya-backend-local
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["host.docker.internal:8000"]

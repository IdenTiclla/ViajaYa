name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_fast:
    name: Backend lint and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIAJAYA_TEST_DATABASE_URL: ""
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.12
          uv sync --locked --extra dev
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: python -m ruff check .

      - name: Check OpenAPI contract
        run: python -m scripts.export_openapi --check

      - name: Extract the base OpenAPI contract
        id: base_contract
        if: github.event_name == 'pull_request'
        env:
          OPENAPI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${OPENAPI_BASE_SHA}:backend/openapi.json" 2>/dev/null; then
            git show "${OPENAPI_BASE_SHA}:backend/openapi.json" > /tmp/viajaya-openapi-base.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The base branch has no OpenAPI snapshot; this PR establishes the initial contract."
          fi

      - name: Reject incompatible OpenAPI changes
        if: github.event_name == 'pull_request' && steps.base_contract.outputs.available == 'true'
        run: >-
          docker run --rm
          -v "/tmp/viajaya-openapi-base.json:/specs/base.json:ro"
          -v "${{ github.workspace }}/backend/openapi.json:/specs/revision.json:ro"
          -v "${{ github.workspace }}/backend/openapi-breaking-accepted.txt:/specs/accepted.txt:ro"
          tufin/oasdiff:v1.17.0
          breaking --fail-on WARN --format githubactions
          --err-ignore /specs/accepted.txt --warn-ignore /specs/accepted.txt
          /specs/base.json /specs/revision.json

      - name: Check the mobile realtime contract
        run: python -m scripts.export_realtime_contract --check

      - name: Validate Prometheus configuration
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "${{ github.workspace }}/ops/monitoring/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.11.3
          check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager configuration
        run: >-
          docker run --rm --entrypoint /bin/amtool
          -v "${{ github.workspace }}/ops/monitoring/alertmanager:/etc/alertmanager:ro"
          prom/alertmanager:v0.32.1
          check-config /etc/alertmanager/alertmanager.yml

      - name: Run fast tests
        run: python -m pytest -q

  backend_postgresql:
    name: Backend PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIAJAYA_TEST_DATABASE_URL: postgresql+asyncpg://viajaya:viajaya@127.0.0.1:5432/test_viajaya_ci
      VIAJAYA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      VIAJAYA_TEST_REDIS_RESTART_URL: redis://127.0.0.1:6380/15
      VIAJAYA_TEST_REDIS_RESTART_CONTAINER: viajaya-ci-redis-restart
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viajaya
          POSTGRES_PASSWORD: viajaya
          POSTGRES_DB: test_viajaya_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viajaya -d test_viajaya_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.12
          uv sync --locked --extra dev
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"

      - name: Start isolated Redis for restart smoke
        run: >-
          docker run --detach
          --name viajaya-ci-redis-restart
          --publish 127.0.0.1:6380:6379
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 20
          redis:7.4-alpine

      - name: Verify migrations and integrity
        run: python -m pytest -q tests/postgresql

      - name: Remove isolated Redis
        if: always()
        run: docker rm --force viajaya-ci-redis-restart

  mobile:
    name: Mobile types, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install HTTP contract tooling
        run: npm --prefix .. ci

      - name: Install locked dependencies
        run: npm ci

      - name: Check generated HTTP DTOs
        run: npm --prefix .. run openapi:check

      - name: Run mobile tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Verify all three Expo build environments
        run: npm run verify:environments:native

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  environment_windows:
    name: Environment contracts on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.12
          uv sync --locked --extra dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify configuration and real JWT boundaries
        run: uv run --locked --no-sync python -m pytest tests/unit/test_environment.py tests/unit/test_environment_boundary.py tests/e2e/test_phone_accounts.py -q

  runtime_image:
    name: Runtime image and disposable database smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the pinned runtime image
        run: docker build --target runtime --tag viajaya-phase1:runtime backend
      - name: Install locked verification dependencies
        working-directory: backend
        run: |
          python -m pip install uv==0.12.12
          uv sync --locked --extra dev
      - name: Verify migrations, readiness, authentication, and production guards
        working-directory: backend
        run: uv run --locked --no-sync python -m scripts.smoke_environment_image

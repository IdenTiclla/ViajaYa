name: Integración continua

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_rapido:
    name: Backend · lint y pruebas rápidas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIAJAYA_TEST_DATABASE_URL: ""
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"

      - name: Verificar estilo
        run: python -m ruff check .

      - name: Verificar contrato OpenAPI
        run: python -m scripts.export_openapi --check

      - name: Ejecutar pruebas rápidas
        run: python -m pytest -q

  backend_postgresql:
    name: Backend · PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIAJAYA_TEST_DATABASE_URL: postgresql+asyncpg://viajaya:viajaya@127.0.0.1:5432/test_viajaya_ci
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viajaya
          POSTGRES_PASSWORD: viajaya
          POSTGRES_DB: test_viajaya_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viajaya -d test_viajaya_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"

      - name: Certificar migraciones e integridad
        run: python -m pytest -q tests/postgresql

  mobile:
    name: Mobile · tipos y lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Instalar herramientas del contrato HTTP
        run: npm --prefix .. ci

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar DTO HTTP generado
        run: npm --prefix .. run openapi:check

      - name: Probar reducers de tiempo real
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Verificar estilo
        run: npm run lint
